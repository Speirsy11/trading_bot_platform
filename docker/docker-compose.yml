services:
  postgres:
    image: timescale/timescaledb:latest-pg16
    container_name: tb-postgres
    environment:
      POSTGRES_USER: trading_bot
      POSTGRES_PASSWORD: changeme
      POSTGRES_DB: trading_bot_dev
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init-db:/docker-entrypoint-initdb.d
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", 'pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"']
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: tb-redis
    command: redis-server --appendonly yes --maxmemory 256mb --maxmemory-policy noeviction
    volumes:
      - redis_data:/data
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  bootstrap:
    profiles: ["ingest"]
    build:
      context: ..
      dockerfile: docker/Dockerfile.api
      target: deps
    working_dir: /app
    command: ["sh", "-lc", "corepack enable && pnpm --filter api exec tsx src/bootstrap.ts"]
    environment:
      DATABASE_URL: postgresql://trading_bot:changeme@postgres:5432/trading_bot_dev
      APP_MODE: ${APP_MODE:-development}
      SEED_TESTING_DATA: ${SEED_TESTING_DATA:-0}
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"
    volumes:
      - ../:/app
      - worker_node_modules:/app/node_modules
      - worker_api_node_modules:/app/apps/api/node_modules

  workers:
    profiles: ["ingest"]
    build:
      context: ..
      dockerfile: docker/Dockerfile.api
      target: deps
    container_name: tb-workers
    working_dir: /app
    command: ["sh", "-lc", "corepack enable && pnpm --filter api exec tsx src/workers/index.ts"]
    env_file:
      - ../.env
    environment:
      DATABASE_URL: postgresql://trading_bot:changeme@postgres:5432/trading_bot_dev
      REDIS_URL: redis://redis:6379/0
      APP_MODE: ${APP_MODE:-development}
      SEED_TESTING_DATA: ${SEED_TESTING_DATA:-0}
      TRADING_ENABLED: ${TRADING_ENABLED:-false}
      SIGNAL_HARVESTER_URL: ${SIGNAL_HARVESTER_URL:-http://host.docker.internal:3010}
      HARVESTER_SYNC_INTERVAL_MS: ${HARVESTER_SYNC_INTERVAL_MS:-60000}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      bootstrap:
        condition: service_completed_successfully
    restart: unless-stopped
    healthcheck:
      test:
        [
          "CMD-SHELL",
          'node -e "fetch(''http://localhost:3002/health'').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"',
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    volumes:
      - ../:/app
      - worker_node_modules:/app/node_modules
      - worker_api_node_modules:/app/apps/api/node_modules
      - worker_exports:/app/apps/api/exports

  db-ui:
    profiles: ["ingest"]
    build:
      context: ..
      dockerfile: docker/Dockerfile.api
      target: deps
    container_name: tb-db-ui
    working_dir: /app
    command: ["sh", "-lc", "corepack enable && pnpm --filter db-ui exec tsx src/index.ts"]
    environment:
      DATABASE_URL: postgresql://trading_bot:changeme@postgres:5432/trading_bot_dev
      PORT: 3003
    ports:
      - "3003:3003"
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test:
        [
          "CMD-SHELL",
          'node -e "fetch(''http://localhost:3003/health'').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"',
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    volumes:
      - ../:/app
      - worker_node_modules:/app/node_modules
      - db_ui_node_modules:/app/apps/db-ui/node_modules

volumes:
  postgres_data:
  redis_data:
  worker_node_modules:
  worker_api_node_modules:
  db_ui_node_modules:
  worker_exports:
